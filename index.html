
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TikTok</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TikTok">

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #fff;
    overflow: hidden;
    font-family: -apple-system, sans-serif;
}

#splash {
    position: fixed;
    inset: 0;
    background: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    opacity: 1;
}

.logo {
    width: 72px;
    height: 72px;
}

.text {
    color: #000;
    margin-top: 22px;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
}

.sub {
    color: #777;
    margin-top: 10px;
    font-size: 14px;
}

.fadeout {
    opacity: 0;
    transition: opacity 0.45s ease;
}
</style>
</head>
<body>

<div id="splash">
    <svg class="logo" viewBox="0 0 24 24"
         xmlns="http://www.w3.org/2000/svg">
        <path d="M19.6 8.2a7.1 7.1 0 0 1-4.3-1.4v7.1
        a6.1 6.1 0 1 1-6.1-6.1c.4 0 .8 0 1.2.1v3.4
        a2.8 2.8 0 1 0 1.7 2.6V2h3.2
        a7.1 7.1 0 0 0 4.3 4.3v1.9Z"
        fill="#25F4EE"
        transform="translate(-1.1 0)"/>
        <path d="M19.6 8.2a7.1 7.1 0 0 1-4.3-1.4v7.1
        a6.1 6.1 0 1 1-6.1-6.1c.4 0 .8 0 1.2.1v3.4
        a2.8 2.8 0 1 0 1.7 2.6V2h3.2
        a7.1 7.1 0 0 0 4.3 4.3v1.9Z"
        fill="#FE2C55"
        transform="translate(0.8 0.5)"/>
        <path d="M19.6 8.2a7.1 7.1 0 0 1-4.3-1.4v7.1
        a6.1 6.1 0 1 1-6.1-6.1c.4 0 .8 0 1.2.1v3.4
        a2.8 2.8 0 1 0 1.7 2.6V2h3.2
        a7.1 7.1 0 0 0 4.3 4.3v1.9Z"
        fill="#000"/>
    </svg>

    <div class="text">TikTok</div>
    <div class="sub">Launching...</div>
</div>

<script>
(function () {
    const url = "https://www.tiktok.com/";
    const splash = document.getElementById("splash");

    setTimeout(function () {
        splash.classList.add("fadeout");

        setTimeout(function () {
            window.location.replace(url);
        }, 450);
    }, 900);
})();
</script>

</body>
</html>
